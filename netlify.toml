[build]
  command = "pnpm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Netlify serwuje produkcyjny build rowniez pod wlasna subdomena projektu i nigdy nie
# przekierowuje jej na domene glowna - ustawienie "primary domain" obejmuje tylko aliasy
# domeny wlasnej (www), nie *.netlify.app. Bez tej reguly twojakolorowanka.netlify.app
# zwraca 200 z ta sama trescia co twoja-kolorowanka.pl, czyli pelny duplikat serwisu bez
# noindex. Musi byc PIERWSZA (reguly ida po kolei) i z force, bo inaczej przegrywa
# z istniejacym plikiem statycznym.
# Permalinki pojedynczych deployow (<id>--twojakolorowanka.netlify.app) to inny host,
# wiec ich nie dotyczy - i nie trzeba, bo Netlify sam wysyla im X-Robots-Tag: noindex.
[[redirects]]
  from = "https://twojakolorowanka.netlify.app/*"
  to = "https://twoja-kolorowanka.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/:path.:ext"
  to = "/:path.:ext"
  status = 200

[[redirects]]
  from = "/koloruj"
  to = "/koloruj/"
  status = 301
  force = true

[[redirects]]
  from = "/koloruj/*"
  to = "/koloruj/"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/koloruj/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Pakiet powitalny newslettera. Plik ma byc dostepny WYLACZNIE z linku w mailu -
# gdyby Google go zaindeksowal, paczka bylaby do pobrania bez zapisu na liste
# i lead magnet stracilby sens.
#
# NIE dodawac tej sciezki do robots.txt jako Disallow. To klasyczna pulapka:
# Disallow blokuje CRAWL, wiec robot nigdy nie przeczyta naglowka ponizej,
# a URL zalinkowany z zewnatrz i tak moze trafic do indeksu - tyle ze wtedy
# bez mozliwosci powiedzenia "noindex". Trzeba pozwolic zajrzec i odmowic
# indeksowania, a nie zabronic zagladania.
[[headers]]
  for = "/pakiet/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# UWAGA: tu bylo max-age=31536000 + immutable, z zalozeniem "assety kolorowanek sie
# nie zmieniaja". Zalozenie przestalo byc prawdziwe wraz z wymiana biblioteki na wlasne
# grafiki: podmieniamy pliki pod TYMI SAMYMI URL-ami (public/<kategoria>/<n>/...).
# "immutable" kaze przegladarce nigdy nie rewalidowac, wiec powracajacy uzytkownik
# widzial stara grafike nawet rok po podmianie - i mieszanke starych z nowymi w jednej
# galerii, bo nowe liscie (dodane ponad dotychczasowa liczbe) nie byly w cache'u.
#
# 1h + must-revalidate: po godzinie przegladarka pyta warunkowo i dostaje 304 (ok. 200 B),
# wiec oszczednosc transferu zostaje prawie cala, a najgorsza staloscia jest godzina.
# CDN Netlify i tak czysci swoj cache przy kazdym deployu.
# Po zakonczeniu migracji (75 kategorii) mozna wrocic do agresywnego cache'u - albo
# lepiej: dodac hasz tresci do URL-i i wtedy "immutable" znowu bedzie prawda.
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Debug-Edge = "on"
