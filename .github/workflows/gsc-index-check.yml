# Kontrola indeksacji stron z sitemapy (huby, kategorie, przekroje, blog).
#
# Wymagane sekrety repo:
#   GSC_SERVICE_ACCOUNT_JSON  cala tresc klucza konta uslugi Google
#   GSC_INGEST_TOKEN          wspolny sekret do funkcji `gsc-store` na Netlify
# Bez ktoregokolwiek workflow konczy sie od razu, bez bledu — tak samo jak pinterest-daily.yml.
#
# Nieudany przebieg = mail z GitHuba i to jest caly mechanizm alertu. Skrypt konczy sie
# bledem TYLKO gdy strona wypadla z indeksu, pojawil sie rozjazd canonicali albo posypala
# sie polowa zapytan. Samo „cos jest poza indeksem" nie alarmuje — to widac w panelu
# pod /panel-delash/indeks i nie ma sensu przypominac o tym co tydzien.
name: gsc-index-check
on:
  schedule:
    - cron: '0 7 * * 1'   # poniedzialek 07:00 UTC = 09:00 PL (lato)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Ile adresow sprawdzic (puste = wszystkie z sitemapy)'
        required: false
        default: ''

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pomin gdy brak sekretow
        id: gate
        run: |
          if [ -z "${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}" ] || [ -z "${{ secrets.GSC_INGEST_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Brak GSC_SERVICE_ACCOUNT_JSON lub GSC_INGEST_TOKEN - pomijam."
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Inspekcja adresow z sitemapy
        if: steps.gate.outputs.skip != 'true'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_INGEST_TOKEN: ${{ secrets.GSC_INGEST_TOKEN }}
        run: |
          node scripts/gsc-index-check.mjs \
            --magazyn https://twoja-kolorowanka.pl/.netlify/functions/gsc-store \
            --out snapshot.json \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      # Historia mieszka w Netlify Blobs. Artefakt jest tylko po to, zeby po nieudanym
      # przebiegu dalo sie obejrzec surowe dane bez wchodzenia do panelu.
      - name: Zachowaj zrzut
        if: steps.gate.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: gsc-snapshot
          path: snapshot.json
          retention-days: 30
          if-no-files-found: warn
