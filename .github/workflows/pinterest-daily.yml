# Dzienna publikacja pinow Pinterest (Etap 5). Wymaga sekretow repo:
#   PINTEREST_APP_ID, PINTEREST_APP_SECRET, PINTEREST_REFRESH_TOKEN
# (Settings -> Secrets and variables -> Actions). Bez sekretow workflow konczy sie od razu, bez bledu.
name: pinterest-daily
on:
  schedule:
    - cron: '30 8 * * *'   # 08:30 UTC = 10:30 PL (lato)
  workflow_dispatch:
    inputs:
      count:
        description: 'Ile pinow opublikowac'
        default: '4'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pomin gdy brak sekretow
        id: gate
        run: |
          if [ -z "${{ secrets.PINTEREST_REFRESH_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Brak sekretow Pinterest - pomijam."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 20
      - name: Zainstaluj sharp
        if: steps.gate.outputs.skip != 'true'
        run: pnpm add -D sharp --ignore-scripts=false
      - name: Publikuj piny
        if: steps.gate.outputs.skip != 'true'
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: node scripts/pinterest/publish.mjs --count ${{ github.event.inputs.count || 4 }}
      - name: Zapisz stan kolejki
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "pinterest-bot"
          git config user.email "actions@github.com"
          git add data/pinterest-state.json
          git diff --cached --quiet || git commit -m "pinterest: stan kolejki po publikacji [skip ci]"
          git push
